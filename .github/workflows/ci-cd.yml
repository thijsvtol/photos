name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/worker/package-lock.json
          apps/web/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install worker dependencies
      run: cd apps/worker && npm ci
    
    - name: Install web dependencies
      run: cd apps/web && npm ci
    
    - name: Run linter checks
      run: npm run lint 2>/dev/null || echo "Linting skipped (no lint script configured)"
    
    - name: Run all tests
      run: npm run test:all
    
    - name: Build worker
      run: cd apps/worker && npm run build
    
    - name: Build web
      run: cd apps/web && npm run build

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/worker/package-lock.json
          apps/web/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit
      run: npm audit --omit=dev --audit-level=high

    - name: Check for security vulnerabilities in worker
      run: cd apps/worker && npm audit --omit=dev --audit-level=high

    - name: Check for security vulnerabilities in web
      run: |
        cd apps/web
        set +e
        npm audit --omit=dev --audit-level=high --json > /tmp/web-audit.json
        AUDIT_EXIT=$?
        set -e
        if [ "$AUDIT_EXIT" -eq 0 ]; then
          echo "No high/critical vulnerabilities found."
          exit 0
        fi
        # Known, accepted advisory: GHSA-qwww-vcr4-c8h2 (react-router RSC-mode
        # CSRF bypass). This app does not use React Router's unstable RSC APIs,
        # so it is not exploitable here. No non-breaking fix exists yet:
        # react-router-dom has no 8.x release (the fix landed in the bare
        # react-router package's v8.3.0), so upgrading requires a breaking
        # migration off react-router-dom. Allow CI to pass ONLY if this is the
        # sole finding; any other high/critical vulnerability still fails.
        if jq -e '(.vulnerabilities | keys | sort) == (["react-router","react-router-dom"] | sort)' /tmp/web-audit.json > /dev/null; then
          echo "::warning::Only the known, accepted GHSA-qwww-vcr4-c8h2 advisory (react-router RSC CSRF bypass, not applicable - this app doesn't use RSC) is present. No non-breaking fix available yet. Allowing CI to pass."
          exit 0
        fi
        echo "Unexpected high/critical vulnerabilities found:"
        npm audit --omit=dev --audit-level=high
        exit 1

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/worker/package-lock.json
          apps/web/package-lock.json
    
    - name: Install dependencies
      run: npm ci && cd apps/worker && npm ci && cd ../web && npm ci
    
    - name: Check for console logs (warning only)
      run: |
        echo "Searching for console statements (warning only - not blocking)..."
        grep -r "console\." apps/worker/src apps/web/src --include="*.ts" --include="*.tsx" | grep -v "node_modules" | wc -l || true
