name: Nightly Backup to B2

# Off-site backup of everything to Backblaze B2 — see scripts/backup-to-b2.sh
# and docs/backup.md for the full rationale.
#
#   * Blobs: rclone sync of the R2 photo/video bucket -> B2 (deletions archived,
#     never hard-deleted).
#   * Database: a full `wrangler d1 export` SQL dump, gzipped and uploaded to B2
#     as a dated blob.
#
# This is the second, independent copy in a 3-2-1 strategy: a different provider
# and account from Cloudflare, so it survives an account/billing problem or a
# bad mass-delete that a second Cloudflare bucket would not.
#
# The two halves are INDEPENDENT (either can fail without the other) and touch
# different B2 prefixes (blobs/ vs db-backups/), so they run as two parallel
# jobs: the tiny, fast D1 dump never has to wait behind the multi-hour blob
# mirror. `mode` on manual dispatch still lets a human run just one half.

on:
  schedule:
    # 05:17 UTC nightly. Deliberately after the 03:00 UTC transcode job
    # (video-transcode.yml), which rewrites videos in R2 in place and can run
    # for a while — we want to back up the transcoded result, not race it. The
    # :17 avoids the top-of-hour scheduling stampede on GitHub's runners.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to back up'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - blobs
          - db

# Never let two backup RUNS (e.g. a manual run overlapping the nightly one)
# mutate the same B2 prefix at once. Scoped to the whole run, so the db and
# blobs jobs of one run can still proceed in parallel.
concurrency:
  group: backup-b2
  cancel-in-progress: false

jobs:
  # --- Database dump: fast, needs wrangler + jq + rclone, independent of transcode. -----
  db:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","db"]'), github.event.inputs.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install rclone
        run: sudo -v ; curl -fsSL https://rclone.org/install.sh | sudo bash

      - uses: ./.github/actions/setup-wrangler

      - name: Back up database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          # BACKUP_STAMP left unset: the script stamps DB dumps with the UTC date
          # (photos-db-YYYY-MM-DD.sql.gz) for human-readable restores. Two runs
          # on the same day overwrite; B2 versioning keeps the earlier one.
        run: ./scripts/backup-to-b2.sh db

  # --- Blob mirror: the long one, only needs rclone. --------------------------
  blobs:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","blobs"]'), github.event.inputs.mode) }}
    runs-on: ubuntu-latest
    # Give a large mirror room to finish; the default 6h ceiling still applies.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Install rclone
        run: sudo -v ; curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Back up blobs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # R2 S3 API token (Object Read is enough for a backup source).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Backblaze B2 application key + target bucket.
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: ./scripts/backup-to-b2.sh blobs
