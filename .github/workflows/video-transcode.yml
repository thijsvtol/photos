name: Nightly Video Transcode

# Checks newly-uploaded (and any previously-unchecked) videos for Chromecast
# compatibility and transcodes HEVC/H.265 videos to H.264 in place, using
# real native ffmpeg on this runner — see scripts/transcode-videos.sh for the
# full rationale (why this runs here and not client-side or in the Worker).
on:
  schedule:
    # 03:00 UTC nightly — low-traffic hours.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Max number of videos to check/transcode this run'
        required: false
        default: '15'

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Run transcode job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/transcode-videos.sh "${{ github.event.inputs.batch_size || '15' }}"
