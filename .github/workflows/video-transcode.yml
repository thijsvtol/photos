name: Nightly Video Transcode

# Checks newly-uploaded (and any previously-unchecked) videos for Chromecast
# compatibility and transcodes HEVC/H.265 videos to H.264 in place, using
# real native ffmpeg on this runner — see scripts/transcode-videos.sh for the
# full rationale (why this runs here and not client-side or in the Worker).
on:
  schedule:
    # 03:00 UTC nightly — low-traffic hours.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Max number of videos to check/transcode this run'
        required: false
        default: '100'

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Run transcode job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 100, not 15. Most of a batch is a cheap ffprobe that finds H.264 and
        # marks it compatible without re-encoding; only genuine HEVC costs real
        # time. 15/night could not keep up with a bulk import (one folder sync
        # added 109 videos in a day), leaving videos that the WebView cannot
        # decode sitting unconverted for a week — which is what users see as
        # "videos don't load".
        #
        # This is only safe now that the codec comparison actually matches (see
        # scripts/transcode-videos.sh): before that fix every already-compatible
        # H.264 file was needlessly re-encoded, so a batch of 100 would have run
        # for many hours instead of minutes.
        run: ./scripts/transcode-videos.sh "${{ github.event.inputs.batch_size || '100' }}"
